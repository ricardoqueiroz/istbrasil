user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Não registrar query strings ou Referer, que podem conter antigos tokens.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # A autorização do redirecionamento usa a URI original, antes da
    # normalização de barras e da decodificação feita pelo Nginx.
    map $request_uri $loja_exata {
        default 0;
        "~^/loja/?(?:\?.*)?$" 1;
    }
    map "$loja_exata:$request_method" $loja_acao {
        default 0;
        "1:GET" 302;
        "1:HEAD" 302;
        "~^1:" 405;
    }
    map $uri $pagina_comercial {
        default 0;
        "~*^/loja(?:/|;|$)" 1;
        "~*^/editora/livro(?:/|;|$)" 1;
    }
    map $uri $privado_comercial {
        default 0;
        "~*^/(?:api/)?istbrasil\.private/products/livros(?:/|;|$)" 1;
        "~*^/uploads/livros(?:/|;|$)" 1;
    }
    map "$pagina_comercial:$privado_comercial:$loja_acao" $comercial_cache {
        default "";
        "~^1:" "no-store";
        "~^0:1:" "no-store";
        "~^0:0:(302|405)$" "no-store";
    }
    map $comercial_cache $comercial_referrer {
        default "no-referrer";
        "" "";
    }
    map $loja_acao $loja_allow {
        default "";
        405 "GET, HEAD";
    }

    # Servidor Node.js backend
    upstream node_backend {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name www.istbrasil.org.br istbrasil.org.br;
        root /var/www/istbrasil.org.br/html; # Caminho para os arquivos de build do Angular
        index index.html index.htm;

        add_header Cache-Control $comercial_cache always;
        add_header Referrer-Policy $comercial_referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Allow $loja_allow always;
        if ($loja_acao = 302) { return 302 "https://loja.istbrasil.org.br/#"; }
        if ($loja_acao = 405) { return 405; }
        if ($pagina_comercial) { return 410; }
        if ($privado_comercial) { return 404; }

        # Redirecionar para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name www.istbrasil.org.br istbrasil.org.br;

        # Configure os caminhos para seus certificados SSL
        # ssl_certificate /etc/letsencrypt/live/istbrasil.org.br/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/istbrasil.org.br/privkey.pem;

        root /var/www/istbrasil.org.br/html; # Caminho para os arquivos de build do Angular
        index index.html index.htm;

        add_header Cache-Control $comercial_cache always;
        add_header Referrer-Policy $comercial_referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Allow $loja_allow always;
        if ($loja_acao = 302) { return 302 "https://loja.istbrasil.org.br/#"; }
        if ($loja_acao = 405) { return 405; }
        if ($pagina_comercial) { return 410; }
        if ($privado_comercial) { return 404; }

        # Proxy para a API Node.js
        location /api/ {
            proxy_pass http://node_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # O caminho exato tambem deve receber a resposta terminal do backend.
        location = /assets/images/livros {
            proxy_pass http://node_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Capas dinamicas: somente a rota publica restrita do Node, sem fallback SPA.
        location ^~ /assets/images/livros/ {
            proxy_pass http://node_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Documentos públicos de projetos: não encaminhar a raiz privada.
        location ^~ /istbrasil.private/projetos/ {
            proxy_pass http://node_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Documentos institucionais de transparencia, servidos pela rota do Node.
        location ^~ /istbrasil.private/documents/ {
            proxy_pass http://node_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Outros caminhos privados não devem cair no fallback Angular.
        location ^~ /istbrasil.private/ {
            return 404;
        }

        # Documentos públicos institucionais, sem expor os demais uploads.
        location ^~ /uploads/documentos/ {
            root /var/www/istbrasil.org.br;
            autoindex off;
            try_files $uri =404;
        }

        # Assets inexistentes não devem retornar o index da aplicação.
        location ^~ /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
