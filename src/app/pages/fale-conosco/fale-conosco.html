<div class="bg-slate-50 min-h-screen pb-20 font-sans text-slate-800">
  <header class="relative ist-background rounded-b-[2.5rem] overflow-hidden mb-12">
    <div class="container mx-auto px-6 py-12 text-center">
      <img src="assets/images/logo-ist.png" class="max-h-32 mx-auto mb-6" />
      <h1 class="text-4xl font-bold text-emerald-900 mb-2">Fale Conosco</h1>
      <p class="text-emerald-700 text-lg">Envie suas dúvidas ou solicitações.</p>
    </div>
  </header>

  <main class="container mx-auto px-6">
    <section class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm p-8 relative">
      <div class="absolute top-0 left-0 h-full w-1 bg-emerald-500"></div>

      <form class="space-y-5" (ngSubmit)="send()">

        <!-- Honeypot invisível -->
        <input type="text" [(ngModel)]="form.honeypot" name="company" class="hidden" />

        <p-inputText
          name="name"
          [(ngModel)]="form.name"
          placeholder="Seu nome"
          required
          class="w-full">
        </p-inputText>

        <p-inputText
          name="email"
          [(ngModel)]="form.email"
          placeholder="Seu e-mail"
          type="email"
          required
          class="w-full">
        </p-inputText>

        <p-dropdown
          name="subject"
          [options]="subjects"
          [(ngModel)]="form.subject"
          placeholder="Assunto"
          class="w-full">
        </p-dropdown>

        <textarea
          pInputTextarea
          rows="5"
          name="message"
          [(ngModel)]="form.message"
          placeholder="Digite sua mensagem"
          required
          class="w-full">
        </textarea>

        <p-button
          label="Enviar mensagem"
          icon="pi pi-send"
          [loading]="loading"
          class="w-full"
          type="submit">
        </p-button>

      </form>
    </section>
  </main>
</div>

<footer-widget></footer-widget>
<p-toast></p-toast>
