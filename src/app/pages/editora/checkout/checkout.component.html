<div class="bg-slate-50 min-h-screen pb-20 font-sans text-slate-800">
      
      <header class="relative ist-background rounded-b-[2.5rem] overflow-hidden mb-12">
        <div class="absolute inset-0 opacity-10 pointer-events-none bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
        
        <div class="container mx-auto px-6 py-12 flex flex-col items-center text-center relative z-10">
          <div class="mb-6 p-4 bg-white rounded-full border border-white/20 shadow-lg inline-block">
            <img src="assets/images/logo-ist.png" alt="Hero Image" class="w-9/12 md:w-auto max-h-32 object-contain mx-auto">
          </div>
          
          <h1 class="text-3xl md:text-5xl font-bold text-emerald-900 mb-3 tracking-tight">
            IST Editora
          </h1>
          <p class="text-emerald-700 text-lg md:text-xl font-light max-w-2xl mx-auto opacity-90">
            A vastidão da Amazônia não cabe apenas em mapas; ela vive em histórias, pesquisas e memórias que precisam ser contadas.
          </p>
        </div>
      </header>

      <main class="container mx-auto px-4 md:px-6 lg:px-8">
      
        <section class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-100 p-8 md:p-10 mb-10 relative overflow-hidden">
            
                <div class="flex flex-col align-items-center justify-content-center">
                    
                    <p-card styleClass="w-full md:w-30rem p-4 shadow-5">
                        <ng-template pTemplate="header">
                            <div class="text-center pt-4">
                                <span class="bg-emerald-100 text-emerald-700 p-2 rounded-lg mr-3 text-3xl inline-block mb-3">
                                <i *ngIf="statusType === 'success'" class="fa-regular fa-circle-check text-green-500"></i>
                                <i *ngIf="statusType === 'error'" class="fa-solid fa-circle-exclamation text-red-500"></i>
                                <i *ngIf="statusType === 'warning'" class="fa-solid fa-triangle-exclamation text-yellow-500"></i>
                                </span>
                                <h2 class="text-900 font-bold text-3xl mb-2">{{ title }}</h2>
                            </div>
                        </ng-template>

                        <div *ngIf="statusType === 'success' && bookTitle" class="flex flex-col items-center gap-3 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
                            <img [src]="bookImg" alt="Capa do Livro" class="w-24 h-auto shadow-md rounded">
                            <div class="text-center">
                                <h3 class="font-bold text-lg text-slate-800">{{ bookTitle }}</h3>
                                <span class="text-sm text-slate-500 uppercase tracking-wide">{{ bookCategory }}</span>
                            </div>
                        </div>

                        <div class="text-center line-height-3 text-700 mb-4">
                            <p>{{ message }}</p>
                            
                            <div *ngIf="orderId" class="mt-3 p-3 bg-blue-50 border-round text-blue-900 font-medium">
                                Número do Pedido: #{{ orderId }}
                            </div>
                        </div>

                        <ng-template pTemplate="footer">
                            <div class="flex flex-col gap-[30px]">
                                <p-button *ngIf="statusType === 'success'" 
                                        label="Baixar Livro" 
                                        icon="pi pi-download" 
                                        styleClass="w-full p-button-success mt-[30px] mb-[30px]"
                                        (onClick)="downloadBook()">
                                </p-button>

                                <p-button label="Fechar / Voltar para Home" 
                                        icon="pi pi-home" 
                                        styleClass="w-full p-button-outlined p-button-secondary" 
                                        (onClick)="goHome()">
                                </p-button>
                            </div>
                        </ng-template>
                    </p-card>

                </div>

        </section>
    </main>
</div>
