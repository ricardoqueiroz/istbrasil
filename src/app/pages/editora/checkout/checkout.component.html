<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-col align-items-center justify-content-center">
        
        <p-card styleClass="w-full md:w-30rem p-4 shadow-5">
            <ng-template pTemplate="header">
                <div class="text-center pt-4">
                    <i *ngIf="statusType === 'success'" class="pi pi-check-circle text-green-500 text-5xl mb-3"></i>
                    <i *ngIf="statusType === 'error'" class="pi pi-times-circle text-red-500 text-5xl mb-3"></i>
                    <i *ngIf="statusType === 'warning'" class="pi pi-exclamation-triangle text-yellow-500 text-5xl mb-3"></i>
                    
                    <h2 class="text-900 font-bold text-3xl mb-2">{{ title }}</h2>
                </div>
            </ng-template>

            <div class="text-center line-height-3 text-700 mb-4">
                <p>{{ message }}</p>
                
                <div *ngIf="orderId" class="mt-3 p-3 bg-blue-50 border-round text-blue-900 font-medium">
                    Número do Pedido: #{{ orderId }}
                </div>
            </div>

            <ng-template pTemplate="footer">
                <div class="flex flex-col gap-3">
                    <p-button *ngIf="statusType === 'success'" 
                              label="Baixar Livro" 
                              icon="pi pi-download" 
                              styleClass="w-full p-button-success"
                              (onClick)="downloadBook()">
                    </p-button>

                    <p-button label="Fechar / Voltar para Home" 
                              icon="pi pi-home" 
                              styleClass="w-full p-button-outlined p-button-secondary" 
                              (onClick)="goHome()">
                    </p-button>
                </div>
            </ng-template>
        </p-card>

    </div>
</div>
