<!-- COMPRA DE LIVRO -->
    <div class="container max-w-4xl mx-auto px-6 pb-12">
        <p-card class="p-6 card">
            <ng-template pTemplate="header">
                <div class="flex justify-between items-center w-full">
                    <span class="text-2xl font-bold">Detalhes do Livro</span>
					<p-button label="" [raised]="true" severity="contrast">
						<a href="../editora" title="Voltar">
							<i  class="pi pi-arrow-left mr-2"></i>
                            <span class="font-bold">Voltar</span>
						</a>
					</p-button>
                </div>
            </ng-template>
            <div class="flex flex-col md:flex-row gap-8">
                <div class="w-full md:w-1/2">
                    <img *ngIf="livroEditorial" [src]="livroEditorial.img" alt="Capa" class="w-full h-auto rounded shadow-lg">
                </div>
                <div class="w-full md:w-1/2 flex flex-col gap-4">
                    <h2 class="text-2xl font-bold mb-1" style="line-height: 1.1">{{ livroEditorial?.title }}</h2>
                    <h3 class="text-lg text-gray-700" style="margin-top: 0px">Formato: {{ livroEditorial?.format }}</h3>
                    <p *ngIf="livroEditorial && preco(livroEditorial)" class="text-xl text-primary font-semibold">{{ livroEditorial && preco(livroEditorial) }}</p>
                    <div class="text-gray-600" [innerHTML]="livroEditorial?.description | jsonDescription"></div>
                    <a *ngIf="livroEditorial?.comercial?.podeComprar === true" pButton
                        [routerLink]="['/loja/produto', livroEditorial?.comercial?.produtoId]">Comprar</a>
                    <p *ngIf="livroEditorial && livroEditorial.comercial?.podeComprar !== true" class="mt-6 text-sm text-surface-600 dark:text-surface-300">Indisponível para compra.</p>
                </div>
            </div>
        </p-card>
    </div>
<footer-widget></footer-widget>
